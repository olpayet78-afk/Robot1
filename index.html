<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Robot Trading - Live EUR/USD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; touch-action: manipulation; }
        .btn-lot { background: #111827; border: 1px solid #374151; padding: 12px 5px; border-radius: 8px; font-weight: bold; font-size: 11px; }
        .active { background: #1d4ed8 !important; border-color: #60a5fa !important; box-shadow: 0 0 15px rgba(59,130,246,0.5); }
        .btn-auth { background: #1f2937; width: 100%; padding: 15px; border-radius: 12px; font-weight: 900; }
        .on { background: #dc2626 !important; animation: pulse 2s infinite; }
        .btn-panic { background: #f97316; color: #000; width: 100%; padding: 12px; border-radius: 8px; font-weight: 900; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        canvas { background: #050505; border: 1px solid #111827; width: 100%; height: 160px; border-radius: 8px; }
        .log-display { background: rgba(30, 58, 138, 0.4); border-left: 4px solid #3b82f6; padding: 8px; font-size: 10px; color: #93c5fd; min-height: 45px; margin-bottom: 10px; }
        #config-panel { display:none; background: #000; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 200; padding: 20px; }
        input { background: #111827; border: 1px solid #3b82f6; color: #fff; padding: 12px; width: 100%; margin-bottom: 10px; border-radius: 8px; }
        #flash-alert { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); z-index:300; padding:40px; border-radius:20px; text-align:center; font-weight:900; font-size:50px; width:85%; border: 4px solid white; }
    </style>
</head>
<body class="p-4">

    <div id="flash-alert"></div>

    <div id="config-panel">
        <h2 class="text-blue-400 font-bold mb-6 text-xl uppercase">Configuration Niveaux</h2>
        <div class="space-y-4">
            <div><label class="text-[10px] text-gray-400">HAUT ANNÉE (HA)</label><input type="number" step="0.00001" id="inp-ha" value="1.09500"></div>
            <div><label class="text-[10px] text-gray-400">PIVOT CENTRAL</label><input type="number" step="0.00001" id="inp-pivot" value="1.08500"></div>
        </div>
        <button onclick="saveConfig()" class="bg-blue-600 w-full p-5 rounded-xl font-black mt-8">VALIDER & CONNECTER</button>
    </div>

    <div class="flex justify-between items-center mb-2">
        <span class="text-[9px] text-blue-500 font-bold uppercase">Compte Demo: 101660280</span>
        <button onclick="document.getElementById('config-panel').style.display='block'" class="text-[10px] bg-gray-900 px-3 py-1 rounded-full uppercase">⚙️ Niveaux</button>
    </div>

    <div id="decision-log" class="log-display">Connexion au flux EUR/USD en cours...</div>

    <div class="space-y-2">
        <button onclick="toggleBot()" id="main-btn" class="btn-auth">ACTIVER LE ROBOT</button>
        <button onclick="panic()" class="btn-panic">PANIC : LIQUIDATION TOTALE</button>
    </div>

    <div class="text-center my-4">
        <div id="price" class="text-6xl font-black tracking-tighter text-blue-500">0.00000</div>
        <div class="flex justify-around mt-3 border-y border-gray-900 py-2">
            <div class="text-center"><span class="block text-[8px] text-gray-500 uppercase">RSI (14)</span><span id="rsi" class="text-sm text-blue-400 font-bold">--</span></div>
            <div class="text-center"><span class="block text-[8px] text-gray-500 uppercase">DIST. PIVOT</span><span id="dist-pivot" class="text-sm text-white font-bold">--</span></div>
        </div>
    </div>

    <div class="grid grid-cols-5 gap-1 mb-4">
        <button onclick="setLot(0.01, this)" class="btn-lot active">0.01</button>
        <button onclick="setLot(0.05, this)" class="btn-lot">0.05</button>
        <button onclick="setLot(0.10, this)" class="btn-lot">0.10</button>
        <button onclick="setLot(0.25, this)" class="btn-lot">0.25</button>
        <button onclick="setLot(0.50, this)" class="btn-lot">0.50</button>
    </div>

    <canvas id="graph"></canvas>

    <div id="journal" class="mt-4 bg-[#050505] border border-gray-900 rounded-lg max-h-40 overflow-y-auto text-[10px] p-2"></div>

    <script>
        let isActive = false;
        let prices = [];
        let currentLot = 0.01;
        let levels = { ha: 1.095, pivot: 1.085 };

        // FONCTION DE CONNEXION PRIX RÉEL (WebSocket)
        function connectRealPrice() {
            const socket = new WebSocket('wss://stream.binance.com:9443/ws/eurusdt@ticker');
            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const realPrice = parseFloat(data.c);
                updateUI(realPrice);
            };
            socket.onclose = () => { setTimeout(connectRealPrice, 5000); };
        }

        function updateUI(p) {
            const el = document.getElementById('price');
            const oldP = parseFloat(el.innerText);
            el.innerText = p.toFixed(5);
            el.style.color = p >= oldP ? "#22c55e" : "#ef4444";
            
            document.getElementById('dist-pivot').innerText = (Math.abs(p - levels.pivot) * 10000).toFixed(1) + " Pips";
            document.getElementById('rsi').innerText = (30 + Math.random()*40).toFixed(2); // Simulation RSI pour l'exemple

            // LOGIQUE BULLE D'EAU
            if(isActive && Math.abs(p - levels.pivot) < 0.0001) {
                logDecision("BULLE D'EAU : Contact avec le Pivot.");
                speak("Bulle d'eau active");
            }

            prices.push(p);
            if(prices.length > 60) prices.shift();
            drawGraph();
        }

        function toggleBot() {
            isActive = !isActive;
            const btn = document.getElementById('main-btn');
            btn.innerText = isActive ? "ARRÊTER LE ROBOT" : "ACTIVER LE ROBOT";
            btn.classList.toggle('on', isActive);
            speak(isActive ? "Robot en service" : "Robot arrêté");
        }

        function saveConfig() {
            levels.ha = parseFloat(document.getElementById('inp-ha').value);
            levels.pivot = parseFloat(document.getElementById('inp-pivot').value);
            document.getElementById('config-panel').style.display = 'none';
            logDecision("NIVEAUX SYNCHRONISÉS.");
            speak("Niveaux mis à jour.");
        }

        function speak(t) {
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'fr-FR';
            window.speechSynthesis.speak(u);
        }

        function drawGraph() {
            const ctx = document.getElementById('graph').getContext('2d');
            ctx.clearRect(0,0,300,160);
            ctx.strokeStyle = "#3b82f6"; ctx.lineWidth = 2;
            ctx.beginPath();
            prices.forEach((p, i) => {
                const x = (i / 60) * 300;
                const y = 80 + (p - prices[0]) * 10000;
                if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            });
            ctx.stroke();
        }

        function logDecision(m) { document.getElementById('decision-log').innerText = m; }

        window.onload = () => { connectRealPrice(); };
        window.onclick = () => { speak(""); };
    </script>
</body>
</html>
