<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Robot AvaTrade Pro v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; touch-action: manipulation; }
        .btn-lot { background: #111827; border: 1px solid #374151; padding: 12px 5px; border-radius: 8px; font-weight: bold; font-size: 11px; }
        .active { background: #1d4ed8 !important; border-color: #60a5fa !important; box-shadow: 0 0 15px rgba(59,130,246,0.5); }
        .btn-auth { background: #1f2937; width: 100%; padding: 15px; border-radius: 12px; font-weight: 900; }
        .on { background: #dc2626 !important; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        canvas { background: #050505; border: 1px solid #111827; width: 100%; height: 160px; border-radius: 8px; }
        .log-display { background: rgba(30, 58, 138, 0.4); border-left: 4px solid #3b82f6; padding: 8px; font-size: 10px; color: #93c5fd; min-height: 35px; margin-bottom: 10px; }
    </style>
</head>
<body class="p-4">

    <div class="flex justify-between text-[9px] text-blue-500 mb-2 font-bold uppercase tracking-tighter">
        <span>Compte: 101660280</span>
        <span id="status-text">Automate: OFF</span>
    </div>

    <div id="decision-log" class="log-display">
        Système prêt. En attente d'autorisation ou de signal...
    </div>

    <button onclick="toggleBot()" id="main-btn" class="btn-auth mb-4">ACTIVER LE SNIPER</button>

    <div class="text-center mb-4">
        <div id="price" class="text-5xl font-black tracking-tighter text-gray-500">1.08500</div>
        <div class="flex justify-center gap-4 mt-1">
            <span id="rsi" class="text-[10px] text-blue-400 font-bold uppercase tracking-widest">RSI (14): --</span>
            <span class="text-[10px] text-orange-400 font-bold uppercase tracking-widest">Pivot: 1.0842</span>
        </div>
    </div>

    <div class="grid grid-cols-5 gap-1 mb-4">
        <button onclick="setLot(0.01, this)" class="btn-lot active">0.01</button>
        <button onclick="setLot(0.05, this)" class="btn-lot">0.05</button>
        <button onclick="setLot(0.10, this)" class="btn-lot">0.10</button>
        <button onclick="setLot(0.25, this)" class="btn-lot">0.25</button>
        <button onclick="setLot(0.50, this)" class="btn-lot">0.50</button>
    </div>

    <canvas id="graph"></canvas>

    <script>
        let isActive = false;
        let prices = [];
        let currentLot = 0.01;
        const canvas = document.getElementById('graph');
        const ctx = canvas.getContext('2d');

        function logDecision(msg) {
            document.getElementById('decision-log').innerText = msg;
        }

        function toggleBot() {
            isActive = !isActive;
            const btn = document.getElementById('main-btn');
            const status = document.getElementById('status-text');
            if(isActive) {
                btn.innerText = "DÉSACTIVER SNIPER"; btn.classList.add('on');
                status.innerText = "Automate: EN SERVICE";
                logDecision("SNIPER ACTIVÉ : Analyse des flux en cours pour détection Bulle d'eau...");
                speak("Robot en service. Sniper prêt.");
            } else {
                btn.innerText = "ACTIVER LE SNIPER"; btn.classList.remove('on');
                status.innerText = "Automate: OFF";
                logDecision("SNIPER ARRÊTÉ : Toutes les positions sont protégées.");
                speak("Robot arrêté.");
            }
        }

        function setLot(val, el) {
            currentLot = val;
            document.querySelectorAll('.btn-lot').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            logDecision("VOLUME MODIFIÉ : " + val + " lot(s) pour la prochaine exécution.");
            speak("Volume réglé à " + val);
        }

        function speak(t) {
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'fr-FR';
            window.speechSynthesis.speak(u);
        }

        function update() {
            const el = document.getElementById('price');
            const oldP = parseFloat(el.innerText);
            const newP = oldP + (Math.random() - 0.5) * 0.0002;
            
            el.innerText = newP.toFixed(5);
            el.style.color = newP >= oldP ? "#22c55e" : "#ef4444";
            
            let rsiVal = (35 + Math.random()*30).toFixed(2);
            document.getElementById('rsi').innerText = "RSI (14): " + rsiVal;

            // Détection fictive de signal pour test visuel
            if(isActive && Math.random() > 0.98) {
                logDecision("SIGNAL DÉTECTÉ : Confirmation Bulle d'eau + Signal Crabe sur Pivot.");
                speak("Confirmation Bulle d'eau détectée");
            }

            prices.push(newP);
            if(prices.length > 60) prices.shift();
            drawGraph();
        }

        function drawGraph() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            // Lignes de niveaux (R1, Pivot)
            ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(0, 40); ctx.lineTo(canvas.width, 40); ctx.stroke(); // R1 approx
            ctx.beginPath(); ctx.moveTo(0, 120); ctx.lineTo(canvas.width, 120); ctx.stroke(); // Pivot approx

            // Ligne de prix
            ctx.strokeStyle = "#3b82f6"; ctx.lineWidth = 3;
            ctx.beginPath();
            prices.forEach((p, i) => {
                const x = (i / 60) * canvas.width;
                const y = canvas.height/2 + (p - prices[0]) * 10000;
                if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            });
            ctx.stroke();
        }

        setInterval(update, 1000);
        window.addEventListener('click', () => { speak(""); }, {once: true});
    </script>
</body>
</html>
