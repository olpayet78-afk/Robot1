<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot AvaTrade Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        .price-up { color: #00ff00; }
        .price-down { color: #ff0000; }
        .preset-active { border: 2px solid #3b82f6; background: #1e3a8a !important; }
        .trading-on { background: #ef4444 !important; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        #chart-container { width: 100%; height: 200px; background: #000; border: 1px solid #1e293b; margin-top: 10px; }
    </style>
</head>
<body class="bg-black text-white font-mono overflow-hidden">

    <div class="p-3 bg-gray-900 border-b-2 border-blue-900 flex justify-between items-center">
        <div id="auth-label" class="text-xs font-bold text-gray-500 uppercase">Automate: OFF</div>
        <button onclick="toggleTrading()" id="auth-btn" class="bg-gray-700 px-4 py-2 rounded-full font-black text-[10px]">AUTORISER LE TRADING</button>
    </div>

    <div class="py-4 text-center">
        <div class="text-[9px] text-gray-500 uppercase">EUR/USD Live Market</div>
        <div id="live-price" class="text-5xl font-bold tracking-tighter">1.08500</div>
        <div id="rsi-display" class="text-[10px] text-blue-400 mt-1 uppercase">RSI (14): calcul...</div>
    </div>

    <div class="px-2 grid grid-cols-5 gap-1 mb-4">
        <button onclick="selectLot(1, 0.01)" id="l1" class="bg-gray-800 py-3 rounded text-[10px] font-bold border border-gray-700">0.01</button>
        <button onclick="selectLot(2, 0.05)" id="l2" class="bg-gray-800 py-3 rounded text-[10px] font-bold border border-gray-700">0.05</button>
        <button onclick="selectLot(3, 0.10)" id="l3" class="bg-gray-800 py-3 rounded text-[10px] font-bold border border-gray-700">0.10</button>
        <button onclick="selectLot(4, 0.25)" id="l4" class="bg-gray-800 py-3 rounded text-[10px] font-bold border border-gray-700">0.25</button>
        <button onclick="selectLot(5, 0.50)" id="l5" class="bg-gray-800 py-3 rounded text-[10px] font-bold border border-gray-700">0.50</button>
    </div>

    <div class="grid grid-cols-2 gap-2 px-2">
        <div id="ind-liquidite" class="bg-gray-900 p-3 rounded border border-gray-800 text-center">
            <div class="text-[10px] text-blue-500 font-bold uppercase">Liquidité</div>
        </div>
        <div id="ind-retournement" class="bg-gray-900 p-3 rounded border border-gray-800 text-center">
            <div class="text-[10px] text-red-500 font-bold uppercase">Retournement</div>
        </div>
    </div>

    <div id="chart-container"></div>

    <script>
        let isTradingAuthorized = false;
        let currentLot = 0.01;
        let lineSeries;

        // --- INITIALISATION DU GRAPHIQUE ---
        function initChart() {
            const chart = LightweightCharts.createChart(document.getElementById('chart-container'), {
                layout: { backgroundColor: '#000000', textColor: '#d1d5db' },
                grid: { vertLines: { visible: false }, horzLines: { color: '#1e293b' } },
                timeScale: { visible: false }
            });
            lineSeries = chart.addLineSeries({ color: '#3b82f6', lineWidth: 2 });
            // Simulation initiale pour voir la ligne
            for(let i=0; i<100; i++) {
                lineSeries.update({ time: Date.now() + i, value: 1.0850 + (Math.random()*0.001) });
            }
        }

        // --- FLUX DE PRIX RÉEL (Yahoo Finance API alternative) ---
        async function fetchPrice() {
            try {
                // On simule un mouvement fluide pour le graphique
                let fakePrice = 1.08500 + (Math.random() - 0.5) * 0.0002;
                updateUI(fakePrice);
            } catch (e) { console.log("Erreur flux"); }
        }

        function updateUI(price) {
            const el = document.getElementById('live-price');
            const oldPrice = parseFloat(el.innerText);
            el.innerText = price.toFixed(5);
            el.className = price >= oldPrice ? 'text-5xl font-bold price-up' : 'text-5xl font-bold price-down';
            if(lineSeries) lineSeries.update({ time: Math.floor(Date.now()/1000), value: price });
        }

        function toggleTrading() {
            isTradingAuthorized = !isTradingAuthorized;
            const btn = document.getElementById('auth-btn');
            const label = document.getElementById('auth-label');
            if(isTradingAuthorized) {
                btn.innerText = "ARRÊTER"; btn.classList.add('trading-on');
                label.innerText = "Automate: EN SERVICE"; label.style.color = "#ef4444";
                speak("Robot en service. Trading autorisé.");
            } else {
                btn.innerText = "AUTORISER LE TRADING"; btn.classList.remove('trading-on');
                label.innerText = "Automate: OFF"; label.style.color = "#6b7280";
                speak("Robot arrêté.");
            }
        }

        function selectLot(n, v) {
            currentLot = v;
            document.querySelectorAll('button').forEach(b => b.classList.remove('preset-active'));
            document.getElementById('l'+n).classList.add('preset-active');
            speak("Lot réglé à " + v);
        }

        function speak(t) {
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'fr-FR';
            window.speechSynthesis.speak(u);
        }

        window.onload = () => {
            initChart();
            selectLot(1, 0.01);
            setInterval(fetchPrice, 1000);
            document.body.addEventListener('click', () => { speak(""); }, {once: true});
        };
    </script>
</body>
</html>
