<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Robot AvaTrade Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; color: #fff; font-family: monospace; }
        .btn-lot { background: #1e293b; border: 1px solid #334155; padding: 15px 5px; border-radius: 8px; font-weight: bold; font-size: 12px; }
        .active { background: #1e40af !important; border-color: #3b82f6 !important; box-shadow: 0 0 10px #3b82f6; }
        .btn-auth { background: #374151; width: 100%; padding: 20px; border-radius: 12px; font-weight: 900; margin-bottom: 20px; }
        .on { background: #b91c1c !important; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        #canvas-graph { background: #0a0a0a; border: 1px solid #1e293b; width: 100%; height: 150px; border-radius: 8px; }
    </style>
</head>
<body class="p-4">

    <div class="flex justify-between text-[10px] text-blue-400 mb-4 uppercase font-bold">
        <span>Compte 101660280</span>
        <span id="status-text">Automate: OFF</span>
    </div>

    <button onclick="toggleBot()" id="main-btn" class="btn-auth">ACTIVER LE ROBOT</button>

    <div class="text-center mb-6">
        <div id="price" class="text-6xl font-black tracking-tighter mb-1 text-gray-400">0.00000</div>
        <div id="rsi" class="text-xs text-blue-500 font-bold uppercase">RSI (14): calcul...</div>
    </div>

    <div class="grid grid-cols-5 gap-2 mb-6">
        <button onclick="setLot(0.01, this)" class="btn-lot active">0.01</button>
        <button onclick="setLot(0.05, this)" class="btn-lot">0.05</button>
        <button onclick="setLot(0.10, this)" class="btn-lot">0.10</button>
        <button onclick="setLot(0.25, this)" class="btn-lot">0.25</button>
        <button onclick="setLot(0.50, this)" class="btn-lot">0.50</button>
    </div>

    <canvas id="canvas-graph"></canvas>

    <script>
        let isActive = false;
        let points = [];
        const canvas = document.getElementById('canvas-graph');
        const ctx = canvas.getContext('2d');

        function toggleBot() {
            isActive = !isActive;
            const btn = document.getElementById('main-btn');
            const status = document.getElementById('status-text');
            if(isActive) {
                btn.innerText = "ARRÊTER LE ROBOT"; btn.classList.add('on');
                status.innerText = "Automate: EN SERVICE"; status.style.color = "#ef4444";
                speak("Robot en service");
            } else {
                btn.innerText = "ACTIVER LE ROBOT"; btn.classList.remove('on');
                status.innerText = "Automate: OFF"; status.style.color = "#60a5fa";
                speak("Robot arrêté");
            }
        }

        function setLot(val, el) {
            document.querySelectorAll('.btn-lot').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            speak("Lot " + val);
        }

        function speak(t) {
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'fr-FR';
            window.speechSynthesis.speak(u);
        }

        function update() {
            // Simulation de prix
            const oldPrice = parseFloat(document.getElementById('price').innerText) || 1.08500;
            const newPrice = oldPrice + (Math.random() - 0.5) * 0.00015;
            
            // UI
            const priceEl = document.getElementById('price');
            priceEl.innerText = newPrice.toFixed(5);
            priceEl.style.color = newPrice >= oldPrice ? "#00ff00" : "#ff0000";
            
            document.getElementById('rsi').innerText = "RSI (14): " + (40 + Math.random() * 20).toFixed(2);

            // Graphique
            points.push(newPrice);
            if(points.length > 50) points.shift();
            drawGraph();
        }

        function drawGraph() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#3b82f6";
            ctx.lineWidth = 2;
            ctx.beginPath();
            const step = canvas.width / 50;
            points.forEach((p, i) => {
                const y = canvas.height / 2 + (p - 1.08500) * 5000;
                if(i === 0) ctx.moveTo(i * step, y);
                else ctx.lineTo(i * step, y);
            });
            ctx.stroke();
        }

        // Lancement
        setInterval(update, 1000);
        window.addEventListener('click', () => { speak(""); }, {once: true});
    </script>
</body>
</html>
